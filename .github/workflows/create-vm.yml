name: Try to Create OCI VM
# GitHub throttles cron heavily on free accounts, so we loop inside each run.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:
env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: "ocid1.image.oc1.us-sanjose-1.aaaaaaaa3vtg3aciw2kohec576hhrwrbsl5jgvy6npdomy6kcq64m64hseaa"
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: "QSHB:US-SANJOSE-1-AD-1"
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI
        run: |
          pip install oci-cli

          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          echo "OCI_API_KEY" >> ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ env.OCI_CLI_REGION }}" >> ~/.oci/config
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

      - name: Try to Create VM (loop every 2 min, up to 5h50m)
        id: create_vm
        continue-on-error: true
        run: |
          MAX_ATTEMPTS=175
          SLEEP_SECONDS=120

          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "========== Attempt $i / $MAX_ATTEMPTS ($(date)) =========="

            OCI_OUTPUT=$(oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":4,"memoryInGBs":24}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "coolify-vm" \
              --boot-volume-size-in-gbs 200 2>&1 || true)

            echo "$OCI_OUTPUT"

            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "SUCCESS! VM is now PROVISIONING!"
              curl -s "https://api.day.app/3zUqGMZTPifBH7pRDw5Z5P/OCI-Free-ARM-Instance/VM创建成功_请立即去OCI控制台查看"
              exit 0
            fi

            echo "Failed. Sleeping ${SLEEP_SECONDS}s before next attempt..."
            sleep $SLEEP_SECONDS
          done

          echo "All $MAX_ATTEMPTS attempts exhausted."
          exit 1

      - name: Send Bark Notification on final failure
        if: always() && steps.create_vm.outcome != 'success'
        run: |
          curl -s "https://api.day.app/3zUqGMZTPifBH7pRDw5Z5P/OCI-Free-ARM-Instance/本轮175次尝试全部失败_等待下一轮"
